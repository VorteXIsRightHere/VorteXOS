name: Build Tubitak Theme Engine APK

on:
  push:
    branches: [main, develop]
    paths:
      - 'TubitakThemeEngine/**'
  pull_request:
    branches: [main]
    paths:
      - 'TubitakThemeEngine/**'
  workflow_dispatch:

jobs:
  build-apk:
    name: Build APK
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: TubitakThemeEngine
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ hashFiles('TubitakThemeEngine/**/*.gradle*', 'TubitakThemeEngine/**/gradle-wrapper.properties') }}
          restore-keys: gradle-

      - name: Make gradlew executable
        run: chmod +x gradlew

      - name: Build debug APK
        run: ./gradlew assembleDebug

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: tubitak-theme-engine-apk
          path: TubitakThemeEngine/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

      - name: Upload build reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-reports
          path: TubitakThemeEngine/app/build/reports
          if-no-files-found: ignore
