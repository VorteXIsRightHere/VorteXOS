# VorteXOS Project Properties
# Bu dosya tüm modüller için geçerli olan yapılandırma değerlerini içerir

# Gradle JVM ayarları
org.gradle.jvmargs=-Xmx4096m -Dfile.encoding=UTF-8

# AndroidX kullan
android.useAndroidX=true

# Non-transitive R classes (daha hızlı build)
android.nonTransitiveRClass=true

# Kotlin code style
kotlin.code.style=official

# Build cache
org.gradle.caching=true

# Parallel build
org.gradle.parallel=true
